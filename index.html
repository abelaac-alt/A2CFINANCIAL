<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marca de Agua Personalizada</title>
<style>
:root{
  --bg:#0f172a; --card:#fff; --text:#0f172a; --muted:#64748b;
  --primary:#2563eb; --success:#16a34a; --border:#e2e8f0;
}
*{box-sizing:border-box}
body{
  margin:0; font-family:Inter,Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#1e293b);
  min-height:100vh; padding:24px; color:var(--text);
}
.app{max-width:1100px;margin:auto}
.header{text-align:center;color:white;margin-bottom:24px}
.header h1{margin:0;font-size:32px}
.header p{color:#cbd5e1}
.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}
.panel,.preview{
  background:var(--card); border-radius:20px; padding:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.section-title{font-weight:700;margin-bottom:12px}
label{display:block;font-size:14px;font-weight:600;margin-top:14px;color:#334155}
input[type="text"],input[type="range"]{width:100%}
input[type="text"]{
  padding:13px;border:1px solid var(--border);border-radius:12px;
  font-size:15px;margin-top:6px;
}
input[type="range"]{margin-top:10px}
.value{float:right;color:var(--muted);font-weight:500}
.btn{
  width:100%;border:none;border-radius:14px;padding:15px;margin-top:14px;
  font-size:16px;font-weight:700;cursor:pointer;transition:.2s;
}
.btn-primary{background:var(--primary);color:white}
.btn-success{background:var(--success);color:white}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.file-input{display:none}
.canvas-wrap{
  background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:18px;
  padding:14px;min-height:420px;display:flex;align-items:center;justify-content:center;
}
canvas{
  max-width:100%;border-radius:14px;background:white;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}
.hint{text-align:center;color:var(--muted);padding:40px}
.small{color:var(--muted);font-size:13px;line-height:1.5}
@media(max-width:850px){
  .grid{grid-template-columns:1fr}
  body{padding:14px}
}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <h1>Protector de Imágenes</h1>
    <p>Añade una marca de agua personalizada, profesional y repetida</p>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="section-title">Configuración</div>

      <label for="imageInput" class="btn btn-primary">📷 Seleccionar o tomar foto</label>
      <input class="file-input" type="file" id="imageInput" accept="image/*" />

      <label>Texto de la marca de agua personalizada</label>
      <input
        type="text"
        id="watermarkText"
        placeholder="Escribe aquí tu marca de agua..."
        value=""
      />

      <label>Tamaño del texto <span class="value" id="sizeValue">34</span></label>
      <input type="range" id="fontSize" min="16" max="90" value="34" />

      <label>Opacidad <span class="value" id="opacityValue">22%</span></label>
      <input type="range" id="opacity" min="5" max="70" value="22" />

      <label>Separación <span class="value" id="spacingValue">220</span></label>
      <input type="range" id="spacing" min="100" max="500" value="220" />

      <label>Rotación <span class="value" id="rotationValue">-30°</span></label>
      <input type="range" id="rotation" min="-60" max="60" value="-30" />

      <button id="downloadBtn" class="btn btn-success" disabled>
        ⬇ Descargar imagen protegida
      </button>

      <p class="small">La imagen se procesa en tu navegador. No se sube a ningún servidor.</p>
    </div>

    <div class="preview">
      <div class="section-title">Vista previa</div>
      <div class="canvas-wrap">
        <div id="emptyState" class="hint">
          Selecciona una imagen y escribe el texto de tu marca de agua.
        </div>
        <canvas id="canvas" style="display:none;"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const imageInput = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const emptyState = document.getElementById("emptyState");

const watermarkText = document.getElementById("watermarkText");
const fontSizeInput = document.getElementById("fontSize");
const opacityInput = document.getElementById("opacity");
const spacingInput = document.getElementById("spacing");
const rotationInput = document.getElementById("rotation");

const sizeValue = document.getElementById("sizeValue");
const opacityValue = document.getElementById("opacityValue");
const spacingValue = document.getElementById("spacingValue");
const rotationValue = document.getElementById("rotationValue");

const downloadBtn = document.getElementById("downloadBtn");

let originalImage = null;

imageInput.addEventListener("change", function(){
  const file = this.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){
    const img = new Image();

    img.onload = function(){
      originalImage = img;
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.style.display = "block";
      emptyState.style.display = "none";
      drawImageWithWatermark();
      downloadBtn.disabled = false;
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
});

[
  watermarkText,
  fontSizeInput,
  opacityInput,
  spacingInput,
  rotationInput
].forEach(element => {
  element.addEventListener("input", drawImageWithWatermark);
});

function updateValues(){
  sizeValue.textContent = fontSizeInput.value;
  opacityValue.textContent = opacityInput.value + "%";
  spacingValue.textContent = spacingInput.value;
  rotationValue.textContent = rotationInput.value + "°";
}

function drawImageWithWatermark(){
  updateValues();
  if(!originalImage) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(originalImage,0,0);

  const text = watermarkText.value.trim();
  if(!text) return;

  const fontSize = Number(fontSizeInput.value);
  const opacity = Number(opacityInput.value) / 100;
  const spacing = Number(spacingInput.value);
  const rotation = Number(rotationInput.value) * Math.PI / 180;

  ctx.save();
  ctx.font = `700 ${fontSize}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = `rgba(255,255,255,${opacity})`;
  ctx.strokeStyle = `rgba(0,0,0,${opacity * 0.8})`;
  ctx.lineWidth = Math.max(1, fontSize * 0.06);

  ctx.translate(canvas.width / 2, canvas.height / 2);
  ctx.rotate(rotation);

  const diagonal = Math.sqrt(canvas.width ** 2 + canvas.height ** 2);

  for(let x = -diagonal; x < diagonal; x += spacing){
    for(let y = -diagonal; y < diagonal; y += spacing){
      drawMultilineText(text, x, y, spacing * 1.7, fontSize * 1.25);
    }
  }

  ctx.restore();
}

function drawMultilineText(text, x, y, maxWidth, lineHeight){
  const words = text.split(" ");
  const lines = [];
  let line = "";

  for(let i = 0; i < words.length; i++){
    const testLine = line + words[i] + " ";
    const width = ctx.measureText(testLine).width;

    if(width > maxWidth && i > 0){
      lines.push(line.trim());
      line = words[i] + " ";
    }else{
      line = testLine;
    }
  }

  lines.push(line.trim());

  const startY = y - ((lines.length - 1) * lineHeight) / 2;

  lines.forEach((lineText, index) => {
    const currentY = startY + index * lineHeight;
    ctx.strokeText(lineText, x, currentY);
    ctx.fillText(lineText, x, currentY);
  });
}

downloadBtn.addEventListener("click", function(){
  if(!originalImage) return;

  const link = document.createElement("a");
  link.download = "imagen-con-marca-de-agua.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});
</script>
</body>
</html>
